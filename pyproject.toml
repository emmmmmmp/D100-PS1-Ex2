[project]
name = "fed"
version = "0.1.0"
description = "GDP analysis for seven countries, 2000-2022"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
pandas = "*"
matplotlib = "*"
requests = "*"
jupyterlab = "*"
ipykernel = "*"

[tool.pixi.pypi-dependencies]
fed = { path = ".", editable = true }

[tool.pixi.tasks]
notebook = "jupyter lab"